[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prolisten-agy-dictation"
version = "0.1.0"
description = "Experimental macOS global dictation using the user's official Antigravity CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "pyte>=0.8.2,<0.9",
  "pynput>=1.8.1,<2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=12.2.2,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12.2.2,<13; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation>=12.2.2,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["ruff>=0.12", "build>=1.2"]

[project.scripts]
agy-dictation = "agy_dictation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
